<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="edit-page">
        <main class="edit-card">
            <a class="back-link" href="{{ url_for('inicio') }}">⬅️ Volver a contactos</a>
            <div class="edit-header">
                <span class="avatar avatar-large">{{ contacto.nombre[0]|upper }}</span>
                <div>
                    <p class="section-kicker">Información personal</p>
                    <h1>Editar contacto</h1>
                </div>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="inline-alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" class="contact-form edit-form">
                <label for="nombre">Nombre <span>*</span></label>
                <input id="nombre" name="nombre" type="text" value="{{ contacto.nombre }}" maxlength="80" required>

                <label for="telefono">Teléfono <span>*</span></label>
                <input id="telefono" name="telefono" type="tel" value="{{ contacto.telefono }}" maxlength="25" required>

                <label for="correo">Correo electrónico</label>
                <input id="correo" name="correo" type="email" value="{{ contacto.correo or '' }}" maxlength="120">

                <label for="categoria">Categoría <span>*</span></label>
                <select id="categoria" name="categoria" required>
                    {% for category in categories %}
                        <option value="{{ category }}" {% if contacto.categoria == category %}selected{% endif %}>{{ category }}</option>
                    {% endfor %}
                </select>

                <div class="form-actions">
                    <a class="button button-secondary" href="{{ url_for('inicio') }}">Cancelar</a>
                    <button class="button button-primary" type="submit">Guardar cambios</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
